# Local broker impersonating broker-ari.everyware-cloud.com (container variant).
#
# Same as mosquitto.conf but with the absolute paths the eclipse-mosquitto image
# uses and logging to stdout (so `docker logs` / `docker compose logs` works).
# Mounted at /mosquitto/config/mosquitto.conf by docker-compose.yml.

listener 8883 0.0.0.0

# The gateway sends a username/password and (optionally) a client cert.
# It does not validate OUR cert, and we accept whatever it sends.
allow_anonymous true
require_certificate false

certfile /mosquitto/config/server.crt
keyfile  /mosquitto/config/server.key

# The gateway negotiated TLS 1.2 with legacy RSA cipher suites.
tls_version tlsv1.2
ciphers DEFAULT@SECLEVEL=0

# No on-disk persistence: this broker only relays live request/reply + telemetry,
# and running as the host user (see docker-compose.yml) keeps it from owning a
# data volume. Nothing here depends on retained messages surviving a restart.
persistence false

log_dest stdout
log_type all
log_timestamp true
connection_messages true
