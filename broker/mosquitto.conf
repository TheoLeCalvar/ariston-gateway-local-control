# Local broker impersonating broker-ari.everyware-cloud.com
#
# Mode: FULLY LOCAL (the gateway talks only to this broker; the Ariston cloud
# and the official app are NOT reachable while this is the only broker).
# For keeping the app working, use mqtt_mitm.py instead (see docs/03).
#
# Paths below are relative; run mosquitto from this directory, or edit to taste.

listener 8883 0.0.0.0

# The gateway sends a username/password and (optionally) a client cert.
# It does not validate OUR cert, and we accept whatever it sends.
allow_anonymous true
require_certificate false

certfile server.crt
keyfile  server.key

# The gateway negotiated TLS 1.2 with legacy RSA cipher suites.
tls_version tlsv1.2
ciphers DEFAULT@SECLEVEL=0

log_type all
log_timestamp true
connection_messages true
