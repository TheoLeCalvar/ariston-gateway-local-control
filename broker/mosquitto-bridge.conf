# Local broker that ALSO bridges to the real Ariston/Eurotech cloud.
#
# This keeps a copy of traffic flowing to the real cloud so the official app
# keeps working, while your local subscribers see everything.
#
# IMPORTANT caveats (see docs/03 for the full discussion):
#  * A bridge connects as its OWN MQTT session using credentials YOU configure
#    here. Eurotech/Kapua accounts are per-device; logging in as the device's
#    client-id from two places causes "session taken over" flapping. Prefer
#    mqtt_mitm.py (transparent proxy) for a clean "app keeps working" setup.
#  * You must supply the device's real broker credentials below. The username
#    is known (AABBCCDDEEFF-XXXXXXXXXX); the password must be recovered from
#    the device's CONNECT (see docs/03, "Recovering the device password").
#  * The real cloud DNS name resolves to YOUR broker now (DNS override), so the
#    bridge address MUST be a real cloud IP, not the hostname.

# --- local listener (same as mosquitto.conf) ---
listener 8883 0.0.0.0
allow_anonymous true
require_certificate false
certfile server.crt
keyfile  server.key
tls_version tlsv1.2
ciphers DEFAULT@SECLEVEL=0
log_type all
log_timestamp true
connection_messages true

# --- bridge to the real cloud ---
connection ari-cloud
# Use a REAL cloud IP (from the capture: 54.74.230.43 and siblings, AWS eu-west-1,
# they rotate — re-resolve with tools/resolve_real.sh). Port 8883, TLS.
address 54.74.230.43:8883
bridge_protocol_version mqttv311
bridge_insecure false
# The real broker has a valid, publicly-trusted cert:
bridge_cafile /etc/ssl/certs/ca-certificates.crt
# Present the real SNI so the cloud's TLS vhost routing works:
# (mosquitto uses the 'address' host for SNI; since we use an IP, pin it here)
# bridge_tls_sni broker-ari.everyware-cloud.com   # uncomment if your mosquitto supports it

remote_username AABBCCDDEEFF-XXXXXXXXXX
remote_password REPLACE_WITH_DEVICE_PASSWORD
remote_clientid ari-bridge-REPLACE   # do NOT reuse the device client-id AABBCCDDEEFF

# Forward the device's telemetry up to the cloud, and cloud commands down.
# 'both' = both directions; QoS 2 to match the device.
topic ari/AABBCCDDEEFF/#              both 2 "" ""
topic $EDC/ari/AABBCCDDEEFF/#         both 2 "" ""
